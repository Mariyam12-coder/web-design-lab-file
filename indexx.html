<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amazon India Clone | React Front-End Assignment</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f3f4f6; }
    .amazon-nav-top { background-color: #131921; }
    .amazon-nav-sub { background-color: #232f3e; }
    .tab-scroll::-webkit-scrollbar { height: 4px; }
    .tab-scroll::-webkit-scrollbar-track { background: transparent; }
    .tab-scroll::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 2px; }
    .img-blend { mix-blend-mode: multiply; }
  </style>
</head>
<body class="min-h-screen text-slate-900 selection:bg-amber-200">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const CURRENCY_FACTOR = 83.50;

    function App() {
      const [inventory, setInventory] = useState([]);
      const [loading, setLoading] = useState(true);
      const [networkError, setNetworkError] = useState(false);
      
      const [activeTab, setActiveTab] = useState('All');
      const [searchQuery, setSearchQuery] = useState('');
      const [allocationBasket, setAllocationBasket] = useState([]);

      useEffect(() => {
        fetch('https://fakestoreapi.com/products')
          .then(res => {
            if (!res.ok) throw new Error("Network issue");
            return res.json();
          })
          .then(data => {
            setInventory(data);
            setLoading(false);
          })
          .catch(err => {
            setLoading(false);
            setNetworkError(true);
          });
      }, []);

      const addToBasket = (product) => {
        setAllocationBasket(prevItems => {
          const matchedItem = prevItems.find(item => item.id === product.id);
          if (matchedItem) {
            return prevItems.map(item => item.id === product.id ? { ...item, qty: item.qty + 1 } : item);
          }
          return [...prevItems, { ...product, qty: 1 }];
        });
      };

      const removeFromBasket = (id) => {
        setAllocationBasket(prevItems => prevItems.filter(item => item.id !== id));
      };

      const resetPageFilters = () => {
        setSearchQuery('');
        setActiveTab('All');
      };

      const totalBasketCount = allocationBasket.reduce((acc, item) => acc + item.qty, 0);

      const itemsFilteredList = inventory.filter(item => {
        const matchesCategory = (activeTab === 'All' || item.category.toLowerCase() === activeTab.toLowerCase());
        const matchesSearch = item.title.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesCategory && matchesSearch;
      });

      return (
        <div className="flex flex-col justify-between min-h-screen">
          <Header 
            activeTab={activeTab} 
            setActiveTab={setActiveTab}
            searchQuery={searchQuery}
            setSearchQuery={setSearchQuery}
            totalBasketCount={totalBasketCount}
            resetPageFilters={resetPageFilters}
          />
          
          <PromoBanner />
          
          <main className="container mx-auto px-4 pb-16 flex-grow -mt-8 md:-mt-16 relative z-20">
            <div className="bg-slate-50/80 backdrop-blur-md p-6 rounded-xl shadow-lg border border-slate-200/60">
              <div className="flex items-center justify-between mb-8 pb-3 border-b border-slate-200">
                <h2 className="text-sm md:text-base font-extrabold text-slate-800 uppercase tracking-wider">
                  {activeTab === 'All' ? "Today's Lightning Deals & Offers" : `${activeTab} Department Showcase`}
                </h2>
              </div>
              
              {loading && (
                <div className="text-center py-24 text-slate-400 font-medium">
                  <i className="fa-solid fa-circle-notch animate-spin text-3xl text-amber-500 mb-3 block mx-auto"></i>
                  Loading curated inventory streams...
                </div>
              )}

              {networkError && (
                <div className="text-center text-red-500 font-bold p-5 border border-red-200 bg-red-50 rounded-lg">
                  Error loading marketplace items. Please verify internet link connection.
                </div>
              )}

              {!loading && !networkError && (
                <ProductGrid products={itemsFilteredList} searchQuery={searchQuery} addToBasket={addToBasket} />
              )}
            </div>
          </main>

          <CartView basket={allocationBasket} totalBasketCount={totalBasketCount} removeFromBasket={removeFromBasket} />
          <FeedbackForm />
          <Footer />
        </div>
      );
    }

    function Header({ activeTab, setActiveTab, searchQuery, setSearchQuery, totalBasketCount, resetPageFilters }) {
      return (
        <header className="sticky top-0 z-50 shadow-sm border-b border-slate-800">
          <div className="amazon-nav-top text-white px-5 py-2 flex items-center justify-between gap-5">
            <div className="flex items-center border border-transparent hover:border-white px-2 py-1 rounded cursor-pointer" onClick={resetPageFilters}>
              <span className="text-xl font-black tracking-tight">amazon<span className="text-amber-400 font-bold text-sm">.in</span></span>
            </div>
            <div className="hidden md:flex flex-col border border-transparent hover:border-white px-2 py-1 rounded cursor-pointer text-xs">
              <span className="text-slate-300 pl-4 font-medium">Delivering to Ghaziabad 201009</span>
              <div className="flex items-center gap-1 font-bold">
                <i className="fa-solid fa-location-dot text-sm text-amber-400"></i>
                <span>Hostel Block Delivery</span>
              </div>
            </div>
            <div className="flex flex-grow max-w-2xl items-center rounded-md focus-within:ring-2 focus-within:ring-amber-500 overflow-hidden bg-white">
              <select 
                value={activeTab} 
                onChange={(e) => setActiveTab(e.target.value)}
                className="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs px-3 focus:outline-none h-[38px] cursor-pointer max-w-[130px] border-r border-slate-200 font-medium"
              >
                <option value="All">All Departments</option>
                <option value="electronics">Electronics</option>
                <option value="jewelery">Jewellery & Accessories</option>
                <option value="men's clothing">Men's Fashion</option>
                <option value="women's clothing">Women's Beauty & Ethnic</option>
              </select>
              <input 
                type="text" 
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                placeholder="Search Amazon.in items..." 
                className="w-full px-3 py-2 text-sm text-slate-900 focus:outline-none h-[38px]"
              />
              <button className="bg-amber-400 hover:bg-amber-500 text-slate-900 px-5 h-[38px] flex items-center justify-center transition">
                <i className="fa-solid fa-magnifying-glass text-base"></i>
              </button>
            </div>
            <div className="border border-transparent hover:border-white px-3 py-1 rounded cursor-pointer transition">
              <a href="#cart-view" className="relative flex items-center gap-2 text-white hover:text-amber-400 transition">
                <div className="relative flex items-end">
                  <span className="absolute -top-2 left-3 bg-amber-500 text-slate-950 text-[11px] font-black px-1.5 rounded-full min-w-[18px] text-center shadow">{totalBasketCount}</span>
                  <i className="fa-solid fa-cart-shopping text-xl"></i>
                </div>
                <span className="font-bold text-xs mt-2 hidden sm:inline">Cart</span>
              </a>
            </div>
          </div>
          <div className="amazon-nav-sub text-white text-xs px-4 py-1.5 flex items-center justify-between overflow-x-auto tab-scroll whitespace-nowrap gap-4">
            <div className="flex items-center space-x-2">
              <button onClick={() => setActiveTab('All')} className={`tab-node px-3 py-1 rounded font-semibold flex items-center gap-1 transition ${activeTab === 'All' ? 'bg-slate-700/50 text-amber-400' : 'hover:bg-slate-700/40 text-white'}`}>
                <i className="fa-solid fa-bars"></i> All Products
              </button>
              <button onClick={() => setActiveTab('electronics')} className={`tab-node px-3 py-1 rounded transition ${activeTab === 'electronics' ? 'bg-slate-700/50 text-amber-400 font-semibold' : 'hover:bg-slate-700/40 text-white'}`}>Electronics</button>
              <button onClick={() => setActiveTab('jewelery')} className={`tab-node px-3 py-1 rounded transition ${activeTab === 'jewelery' ? 'bg-slate-700/50 text-amber-400 font-semibold' : 'hover:bg-slate-700/40 text-white'}`}>Jewellery & Cosmetics</button>
              <button onClick={() => setActiveTab("men's clothing")} className={`tab-node px-3 py-1 rounded transition ${activeTab === "men's clothing" ? 'bg-slate-700/50 text-amber-400 font-semibold' : 'hover:bg-slate-700/40 text-white'}`}>Men's Wear</button>
              <button onClick={() => setActiveTab("women's clothing")} className={`tab-node px-3 py-1 rounded transition ${activeTab === "women's clothing" ? 'bg-slate-700/50 text-amber-400 font-semibold' : 'hover:bg-slate-700/40 text-white'}`}>Women's Ethnic & Beauty</button>
              <span class="text-slate-500 px-1">|</span>
              <a href="https://unstop.com" target="_blank" className="text-slate-300 hover:text-amber-400 transition px-2 font-medium">Unstop Challenges</a>
              <a href="#" className="text-slate-300 hover:text-amber-400 transition px-2 font-medium">AKTU Syllabus Docs</a>
              <a href="#" className="text-slate-300 hover:text-amber-400 transition px-2 font-medium">ERP Login Hub</a>
            </div>
          </div>
        </header>
      );
    }

    function PromoBanner() {
      return (
        <div className="relative bg-slate-900 h-44 md:h-64 flex items-center overflow-hidden">
          <div className="absolute inset-0 bg-cover bg-center opacity-60 transform scale-105" style={{backgroundImage: "url('https://images.unsplash.com/photo-1607082348824-0a96f2a4b9da?q=80&w=2070')"}}></div>
          <div className="absolute inset-0 bg-gradient-to-t from-slate-100 via-transparent to-black/20"></div>
          <div className="relative z-10 max-w-lg ml-6 md:ml-16 bg-white/95 backdrop-blur-sm p-5 rounded-lg shadow-xl border border-slate-200/60">
            <span className="bg-red-600 text-white font-bold text-[9px] px-2 py-0.5 rounded-full uppercase tracking-wider">Festival Blockbuster</span>
            <h1 className="text-xl md:text-2xl font-black tracking-tight mt-2 text-slate-900 leading-tight">Up to 60% Off | Tech Assets & Wardrobe Essentials</h1>
            <p className="text-xs text-slate-600 mt-2 font-medium">Free immediate shipping for campus address orders via Prime delivery nodes.</p>
          </div>
        </div>
      );
    }

    function ProductGrid({ products, searchQuery, addToBasket }) {
      if (products.length === 0) {
        return (
          <div className="text-center py-16 text-slate-400 col-span-full bg-slate-100/50 rounded-xl border border-dashed border-slate-200">
            No matching items found for selection.
          </div>
        );
      }

      return (
        <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
          {products.map(item => {
            const standardInrPrice = Math.round(item.price * CURRENCY_FACTOR);
            const baselineMrp = Math.round(standardInrPrice * 1.4);
            const starCount = Math.round(item.rating?.rate || 4);
            
            return (
              <div key={item.id} className="bg-white p-4 rounded-xl border border-slate-200/60 flex flex-col justify-between hover:shadow-xl transition-all duration-300 hover:-translate-y-1 relative group bg-gradient-to-b from-white to-slate-50/30">
                <div>
                  <div className="w-full h-44 flex items-center justify-center overflow-hidden mb-4 bg-white rounded-lg p-3 border border-slate-100 relative group-hover:border-amber-200/60 transition duration-300">
                    <img src={item.image} className="max-h-full max-w-full object-contain img-blend group-hover:scale-105 transition-transform duration-300" alt="Item Image" />
                  </div>
                  <h4 className="text-xs font-semibold text-slate-800 line-clamp-2 mt-1 hover:text-amber-600 cursor-pointer transition duration-150 leading-relaxed">{item.title}</h4>
                  <div className="flex items-center mt-2 space-x-1.5">
                    <div className="flex gap-0.5">
                      {Array.from({ length: 5 }, (_, idx) => (
                        <i key={idx} className={`${idx < starCount ? 'fa-solid text-amber-400' : 'fa-regular text-slate-300'} fa-star text-[10px]`}></i>
                      ))}
                    </div>
                    <span className="text-sky-700 text-[11px] font-medium ml-1">{item.rating?.count || 140} metrics</span>
                  </div>
                </div>
                <div className="mt-5 pt-3 border-t border-slate-100">
                  <div className="flex items-baseline gap-1">
                    <span className="text-xs font-medium text-slate-500">₹</span>
                    <span className="text-lg font-black text-slate-900">{standardInrPrice.toLocaleString('en-IN')}</span>
                    <span className="text-xs text-slate-400 line-through ml-1.5">₹{baselineMrp.toLocaleString('en-IN')}</span>
                  </div>
                  <button onClick={() => addToBasket(item)} className="w-full bg-amber-400 hover:bg-amber-500 text-slate-900 text-xs font-bold py-2 rounded-lg mt-3 transition shadow-sm">
                    Add to Cart
                  </button>
                </div>
              </div>
            );
          })}
        </div>
      );
    }

    function CartView({ basket, totalBasketCount, removeFromBasket }) {
      const basketSumAggregate = basket.reduce((acc, obj) => acc + (Math.round(obj.price * CURRENCY_FACTOR) * obj.qty), 0);

      return (
        <section id="cart-view" className="bg-slate-200 py-12 border-t border-slate-300 shadow-inner">
          <div className="container mx-auto px-4 max-w-4xl">
            <div className="bg-white p-6 rounded-xl shadow-md border border-slate-200">
              <h2 className="text-base font-extrabold text-slate-800 mb-5 flex items-center gap-2 pb-3 border-b border-slate-100">
                <i className="fa-solid fa-basket-shopping text-amber-500"></i>
                <span>Your Shopping Basket</span>
              </h2>
              {basket.length === 0 ? (
                <p className="text-slate-400 text-sm text-center py-8 font-medium">Your shopping cart module contains no current selections.</p>
              ) : (
                <div>
                  <div className="divide-y divide-slate-100">
                    {basket.map(item => {
                      const basePrice = Math.round(item.price * CURRENCY_FACTOR);
                      return (
                        <div key={item.id} className="py-4 flex justify-between items-center text-xs gap-4">
                          <div className="flex items-center space-x-4">
                            <img src={item.image} className="w-12 h-12 object-contain img-blend" />
                            <div>
                              <h5 className="font-bold text-slate-800 text-sm line-clamp-1">{item.title}</h5>
                              <button onClick={() => removeFromBasket(item.id)} className="text-red-500 hover:underline mt-1 block">Delete</button>
                            </div>
                          </div>
                          <div className="text-right min-w-[100px]">
                            <span>Quantity: <strong>{item.qty}</strong></span>
                            <span className="font-black text-sm block mt-1">₹{(basePrice * item.qty).toLocaleString('en-IN')}</span>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                  <div className="mt-5 pt-4 border-t border-slate-200 flex justify-between items-center">
                    <span className="text-base font-extrabold">Order Subtotal: <span className="text-xl font-black ml-1">₹{basketSumAggregate.toLocaleString('en-IN')}</span></span>
                    <button onclick="alert('Transaction processing simulated')" class="bg-amber-400 hover:bg-amber-500 font-bold px-8 py-2.5 rounded-lg text-xs uppercase shadow transition">Place Order</button>
                  </div>
                </div>
              )}
            </div>
          </div>
        </section>
      );
    }

    function FeedbackForm() {
      const [dataFields, setDataFields] = useState({ name: '', email: '', message: '' });
      const [validationErrors, setValidationErrors] = useState({});
      const [toastToggle, setToastToggle] = useState(false);

      const handleFormVerification = (e) => {
        e.preventDefault();
        let errors = {};
        let flag = true;

        if (!dataFields.name.trim()) {
          errors.name = "Full name required.";
          flag = false;
        }
        if (!dataFields.email.trim() || !dataFields.email.includes('@')) {
          errors.email = "Valid email handle required.";
          flag = false;
        }
        if (!dataFields.message.trim()) {
          errors.message = "Message details required.";
          flag = false;
        }

        setValidationErrors(errors);
        if (flag) {
          setToastToggle(true);
          setDataFields({ name: '', email: '', message: '' });
          setTimeout(() => setToastToggle(false), 4000);
        }
      };

      return (
        <section className="bg-slate-50 py-14 border-t border-slate-200">
          <div className="max-w-md mx-auto px-4">
            <div className="border border-slate-200 rounded-xl p-6 shadow-md bg-white">
              <h3 className="text-base font-extrabold text-slate-800 uppercase tracking-wide">Lab Project Feedback Hub</h3>
              
              {toastToggle && (
                <div className="mb-4 p-3 bg-emerald-50 text-emerald-800 text-xs font-semibold rounded-lg border border-emerald-200">
                  Data validated successfully. support ticket logged.
                </div>
              )}

              <form onSubmit={handleFormVerification} className="space-y-4" noValidate>
                <div>
                  <label className="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1">Full Name</label>
                  <input 
                    type="text" 
                    value={dataFields.name}
                    onChange={(e) => setDataFields({ ...dataFields, name: e.target.value })}
                    className="w-full px-3 py-2 border border-slate-200 rounded-md text-sm focus:outline-none focus:border-amber-500 bg-slate-50" 
                  />
                  {validationErrors.name && <p className="text-xs text-red-500 mt-1">{validationErrors.name}</p>}
                </div>
                <div>
                  <label className="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1">Email ID</label>
                  <input 
                    type="email" 
                    value={dataFields.email}
                    onChange={(e) => setDataFields({ ...dataFields, email: e.target.value })}
                    className="w-full px-3 py-2 border border-slate-200 rounded-md text-sm focus:outline-none focus:border-amber-500 bg-slate-50" 
                  />
                  {validationErrors.email && <p className="text-xs text-red-500 mt-1">{validationErrors.email}</p>}
                </div>
                <div>
                  <label className="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1">Message Body</label>
                  <textarea 
                    rows="3" 
                    value={dataFields.message}
                    onChange={(e) => setDataFields({ ...dataFields, message: e.target.value })}
                    className="w-full px-3 py-2 border border-slate-200 rounded-md text-sm focus:outline-none focus:border-amber-500 bg-slate-50" 
                  ></textarea>
                  {validationErrors.message && <p className="text-xs text-red-500 mt-1">{validationErrors.message}</p>}
                </div>
                <button type="submit" className="w-full bg-amber-400 hover:bg-amber-500 text-slate-900 font-bold py-2.5 rounded-md text-xs uppercase tracking-wider shadow-sm">
                  Log Support Ticket
                </button>
              </form>
            </div>
          </div>
        </section>
      );
    }

    function Footer() {
      return (
        <footer className="amazon-nav-top text-slate-400 text-xs border-t border-slate-800">
          <div className="container mx-auto px-5 py-12 text-center">
            <p>&copy; 2026, Amazon.in, Inc. Evaluation Build Prototype Asset Storage.</p>
          </div>
        </footer>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
